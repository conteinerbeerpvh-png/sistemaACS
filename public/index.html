<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ACS Cadastro</title><link rel="stylesheet" href="style.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<section id="authScreen" class="auth-screen"><div class="auth-card"><h1><i class="fas fa-heartbeat"></i> ACS Cadastro</h1><p id="authDescricao">Entre para acessar seus cadastros individuais.</p><form id="loginForm"><div class="form-group"><label for="loginUsuario">Usuário</label><input id="loginUsuario" required autocomplete="username"></div><div class="form-group"><label for="loginSenha">Senha</label><input id="loginSenha" type="password" required autocomplete="current-password"></div><button class="btn-primary">Entrar</button></form><form id="registerForm" hidden><div class="form-group"><label for="novoNome">Seu nome</label><input id="novoNome" required></div><div class="form-group"><label for="novoUsuario">Usuário</label><input id="novoUsuario" required autocomplete="username"></div><div class="form-group"><label for="novaSenha">Senha (mínimo 6 caracteres)</label><input id="novaSenha" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn-primary">Criar conta</button></form><button id="toggleAuth" type="button" class="link-button">Criar novo usuário e senha</button><p id="authMensagem" class="mensagem"></p></div></section>
<div id="appScreen" class="container" hidden><header><div><h1><i class="fas fa-heartbeat"></i> ACS Cadastro</h1><p>Sistema de Cadastro para Agentes Comunitários de Saúde</p></div><div class="user-menu"><span id="usuarioLogado"></span><button type="button" id="logoutBtn" class="btn-cancel">Sair</button></div></header><main>
<div class="card"><h2><i class="fas fa-user-plus"></i> <span id="formTitle">Novo Cadastro</span></h2><form id="cadastroForm"><div class="ocr-section"><label for="fichaUpload"><i class="fas fa-camera"></i> Escanear ficha</label><div class="ocr-container"><input type="file" id="fichaUpload" accept="image/*,application/pdf"><button type="button" id="btnScan" class="btn-scan">Preencher automático</button></div><small id="scanStatus" class="scan-status"></small></div><div class="form-group"><label for="nomeCompleto">Nome completo *</label><input id="nomeCompleto" required></div><div class="form-row"><div class="form-group"><label for="dataNascimento">Data de nascimento *</label><input id="dataNascimento" placeholder="DD/MM/AAAA" maxlength="10" required></div><div class="form-group"><label for="cpf">CPF *</label><input id="cpf" placeholder="000.000.000-00" required></div></div><div class="form-row"><div class="form-group"><label for="telefone">Telefone *</label><input id="telefone" placeholder="(00) 00000-0000" required></div><div class="form-group"><label for="sexo">Sexo *</label><select id="sexo" required><option value="">Selecione</option><option value="M">Masculino</option><option value="F">Feminino</option></select></div></div><div class="form-row"><div class="form-group"><label for="criancaDeZeroANove">Criança de 0 a 9 anos? *</label><select id="criancaDeZeroANove" required><option value="">Selecione</option><option value="true">Sim</option><option value="false">Não</option></select></div><div class="form-group"><label for="gestante">Está gestante? *</label><select id="gestante" required><option value="">Selecione</option><option value="true">Sim</option><option value="false">Não</option></select></div></div><div class="form-row"><div class="form-group" style="flex:2"><label for="endereco">Endereço *</label><input id="endereco" required></div><div class="form-group"><label for="numero">Número *</label><input id="numero" required></div></div><div class="form-group"><label for="bairro">Bairro *</label><input id="bairro" required></div><fieldset class="doencas"><legend>Doenças pré-existentes</legend><label><input type="checkbox" name="doenca" value="Hipertensão"> Hipertensão</label><label><input type="checkbox" name="doenca" value="Diabetes"> Diabetes</label><label><input type="checkbox" name="doenca" value="Tuberculose"> Tuberculose</label><label><input type="checkbox" name="doenca" value="Hanseníase"> Hanseníase</label><label><input type="checkbox" name="doenca" value="Câncer"> Câncer</label><label><input type="checkbox" name="doenca" value="Asma"> Asma</label><label><input type="checkbox" name="doenca" value="HIV"> HIV</label></fieldset><div class="form-buttons"><button type="submit" id="submitBtn" class="btn-primary"><i class="fas fa-save"></i> Salvar cadastro</button><button type="button" id="cancelBtn" class="btn-cancel" hidden>Cancelar</button></div></form></div>
<div class="card"><h2><i class="fas fa-search"></i> Meus Cadastros</h2><div class="search-container"><input id="searchInput" placeholder="Buscar por nome, CPF, telefone, bairro ou endereço"><button id="buscarBtn" class="btn-secondary">Buscar</button><button id="limparBtn" class="btn-clear">Limpar</button></div><div id="statsBar" class="stats-bar" hidden><span id="resultCount"></span></div><div id="cadastrosList" class="cadastros-list"></div></div></main></div><script src="script.js?v=5"></script></body></html>
